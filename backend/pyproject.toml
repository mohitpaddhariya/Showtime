[project]
name = "showtime-backend"
version = "0.1.0"
description = "Showtime — turn rough screen recordings into polished demo videos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3.10",
    "openai-whisper>=20240930",
    "groq>=0.9",
    "ollama>=0.4",
    "ffmpeg-python>=0.2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
showtime = "app.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires external binaries (ffmpeg, tesseract, ollama)",
    "slow: downloads models or processes real media",
    "e2e: full end-to-end pipeline test",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
